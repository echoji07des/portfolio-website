name: GitHub Pages smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Wait for Pages deployment and verify public files
        env:
          SITE_URL: https://echoji07des.github.io/portfolio-website
        run: |
          set -e

          for path in "/" "/order.html" "/style.css" "/site.js" "/order.js"; do
            for attempt in {1..18}; do
              status=$(curl -L -sS -o /tmp/pages-smoke-response -w "%{http_code}" "$SITE_URL$path" || true)
              if [ "$status" = "200" ]; then
                echo "$path -> HTTP 200"
                break
              fi

              echo "$path -> HTTP $status (attempt $attempt/18)"
              if [ "$attempt" = "18" ]; then
                exit 1
              fi
              sleep 10
            done
          done
